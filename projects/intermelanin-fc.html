/* Layout: a film page. Title block beside the vertical film, then a placeholder for the production notes. */
:root{--bg:#000;--ink:#FFF;--red:#E62E2E;--dim:#A8A8A8;--type:'Special Elite','Courier New',monospace;--goth:'UnifrakturMaguntia','Old English Text MT',serif;--read:'Alegreya',Georgia,serif;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--read);font-size:19px;line-height:1.6}
.back{position:fixed;top:20px;left:20px;z-index:5;font-family:var(--goth);font-size:22px;letter-spacing:1px;color:#FFF;text-decoration:none;padding:6px 10px;border:1px solid #FFF;background:#000}
.back:hover,.back:focus-visible{background:var(--red);border-color:var(--red);color:#000;outline:none}
.page{max-width:1080px;margin:0 auto;padding:96px max(20px,env(safe-area-inset-right,0px)) 72px max(20px,env(safe-area-inset-left,0px));box-sizing:border-box}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:48px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:40px}
.kick{display:flex;align-items:baseline;gap:12px;font-family:var(--type);font-size:13px;letter-spacing:.22em;color:var(--dim)}
.kick b{font-family:var(--read);font-weight:900;font-size:26px;letter-spacing:0;color:var(--red)}
h1{margin:14px 0 18px;font-family:var(--goth);font-weight:400;font-size:clamp(56px,8vw,104px);line-height:.9}
.dek{margin:0;font-family:var(--type);font-size:16px;line-height:1.7;letter-spacing:.03em;color:#DDD;max-width:42ch}
.feat{display:inline-block;margin-top:22px;padding:6px 12px;background:var(--red);color:#000;font-family:var(--type);font-size:13px;letter-spacing:.18em}
.film{position:relative;aspect-ratio:9/16;border:2px solid var(--ink);box-shadow:8px 8px 0 var(--red);background:#111}
.film video{display:block;width:100%;height:100%;object-fit:cover}
.notes{margin-top:44px;border:2px dashed #555;padding:28px;text-align:center}
.notes h2{margin:0 0 6px;font-family:var(--goth);font-weight:400;font-size:clamp(30px,4vw,44px)}
.notes p{margin:0;font-family:var(--type);font-size:14px;letter-spacing:.08em;color:var(--dim)}
footer{margin-top:56px;font-family:var(--type);font-size:12px;letter-spacing:.2em;color:var(--dim);text-align:center}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:32px}.film{max-width:380px;width:100%;margin:0 auto}}
