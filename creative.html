<style>
/* Layout: a story grid. Gothic page title, then tiles: a bold illustrated thumbnail, a big headline, a one-line dek and tags. */
:root{--bg:#000;--ink:#FFF;--red:#E62E2E;--dim:#A8A8A8;--line:#2E2E2E;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Alegreya',Georgia,serif}
.back{position:fixed;top:20px;left:20px;z-index:5;font-family:'UnifrakturMaguntia','Old English Text MT',serif;font-size:22px;letter-spacing:1px;color:#FFF;text-decoration:none;padding:6px 10px;border:1px solid #FFF;background:#000}
.back:hover,.back:focus-visible{background:#E62E2E;border-color:#E62E2E;color:#000;outline:none}
.page{max-width:1280px;margin:0 auto;padding:96px max(20px,env(safe-area-inset-right,0px)) 64px max(20px,env(safe-area-inset-left,0px));box-sizing:border-box}
header{display:flex;flex-direction:column;align-items:flex-start;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:18px}
h1{margin:0;font-family:'UnifrakturMaguntia','Old English Text MT',serif;font-weight:400;font-size:clamp(72px,11vw,140px);line-height:.85}
.tag{margin:0;font-family:'Special Elite','Courier New',monospace;font-size:15px;letter-spacing:.12em;line-height:1.5;color:#CFCFCF;max-width:60ch}
.intro{margin:0;max-width:44ch;font-size:19px;line-height:1.45;color:#DDD}
.count{font-family:'Special Elite',monospace;font-size:13px;letter-spacing:.25em;color:var(--dim);margin:22px 0 0}

.grid{list-style:none;margin:32px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:44px 32px}
.story{display:flex;flex-direction:column;gap:12px;color:var(--ink);text-decoration:none;height:100%}
.thumb{position:relative;aspect-ratio:1/1;overflow:hidden;border:2px solid var(--ink);transition:transform .25s ease}
.thumb svg{display:block;width:100%;height:100%}
a.story:hover .thumb,a.story:focus-visible .thumb{transform:translate(-6px,-6px);box-shadow:6px 6px 0 var(--red)}
a.story:focus-visible{outline:none}
a.story:focus-visible .thumb{outline:2px dashed var(--red);outline-offset:8px}
.kick{display:flex;align-items:baseline;gap:10px;font-family:'Special Elite',monospace;font-size:13px;letter-spacing:.2em;color:var(--dim);margin-top:4px}
.kick b{font-family:'Alegreya',Georgia,serif;font-weight:900;font-size:22px;letter-spacing:0;color:var(--red)}
.story.soon .kick b{color:#666}
.story h2{margin:0;font-family:'Special Elite','Courier New',monospace;font-weight:400;font-size:clamp(21px,1.9vw,26px);line-height:1.15;letter-spacing:.04em}
a.story:hover h2{color:var(--red)}
.story p{margin:0;font-family:'Special Elite','Courier New',monospace;font-size:14px;line-height:1.6;letter-spacing:.03em;color:#CFCFCF}
.tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px 14px;font-family:'Special Elite',monospace;font-size:12px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.tags span+span::before{content:'· ';color:var(--red)}
.story.soon{color:#777}
.story.soon .thumb{border-style:dashed;border-color:#555}
.story.soon h2{color:#8C8C8C}
.story.soon p{color:#6E6E6E}

@media (prefers-reduced-motion:reduce){.thumb{transition:none}a.story:hover .thumb{transform:none}}

    label  optional: show this instead of the number, e.g. '#ShortFilm' (it doesn't use up a number)
    tags   short labels, e.g. ['Film', 'Football']
    art    id of a <template> above with the tile artwork, or img: 'assets/your-thumb.png'
*/
var PROJECTS = [
  { title: 'InterMelanin FC', dek: 'A short film about InterMelanin FC, a football team for Black women and non-binary people. Feat. COPA90 × EA FC.', href: 'projects/intermelanin-fc.html', label: '#ShortFilm', month: 'OCT 2026', tags: ['Film', 'Football', 'Community'], art: 'art-intermelanin' },
  { title: 'Coming soon', dek: 'The next piece is still in the edit.', href: '', label: '#Next', tags: ['In the edit'], art: 'art-soon' }
];
(function () {
  var grid = document.getElementById('grid'), live = 0, num = 0;
  PROJECTS.forEach(function (p, i) {
    var open = !!p.href; if (open) live++;
    var li = document.createElement('li');
    var a = document.createElement(open ? 'a' : 'div');
    a.className = 'story' + (open ? '' : ' soon');
    if (open) a.href = p.href;
    var th = document.createElement('div'); th.className = 'thumb';
    if (p.img) { var im = document.createElement('img'); im.src = p.img; im.alt = ''; im.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block'; th.appendChild(im); }
    else if (p.art) { var t = document.getElementById(p.art); if (t) th.appendChild(t.content.cloneNode(true)); }
    a.appendChild(th);
    var k = document.createElement('div'); k.className = 'kick';
    var n = document.createElement('b'); n.textContent = p.label || '#' + (++num); k.appendChild(n);
    var m = document.createElement('span'); m.textContent = p.month || 'COMING SOON'; k.appendChild(m);
    a.appendChild(k);
    var h = document.createElement('h2'); h.textContent = p.title; a.appendChild(h);
    var d = document.createElement('p'); d.textContent = p.dek; a.appendChild(d);
    var tg = document.createElement('div'); tg.className = 'tags';
    (p.tags || []).forEach(function (x) { var s = document.createElement('span'); s.textContent = x; tg.appendChild(s); });
    a.appendChild(tg);
    li.appendChild(a); grid.appendChild(li);
  });
})();
</script>
</body>
