<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Data Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      .lost {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 8vw 6vw;
        gap: 18px;
      }

      .lost-code {
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--grey);
        letter-spacing: 0.1em;
      }

      .lost-glitch {
        font-weight: 800;
        font-size: clamp(4rem, 16vw, 9rem);
        line-height: 0.85;
        letter-spacing: -0.03em;
        position: relative;
      }

      .lost-glitch::before,
      .lost-glitch::after {
        content: "404";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        opacity: 0.7;
      }

      .lost-glitch::before {
        color: var(--grey-light);
        animation: glitch-a 2.6s infinite linear;
      }

      .lost-glitch::after {
        color: var(--grey);
        animation: glitch-b 3.1s infinite linear;
      }

      @keyframes glitch-a {
        0%, 92%, 100% { transform: translate(0, 0); opacity: 0; }
        93% { transform: translate(-3px, 1px); opacity: 0.6; }
        95% { transform: translate(3px, -1px); opacity: 0.5; }
        97% { transform: translate(-2px, 0); opacity: 0; }
      }

      @keyframes glitch-b {
        0%, 90%, 100% { transform: translate(0, 0); opacity: 0; }
        91% { transform: translate(3px, -1px); opacity: 0.5; }
        94% { transform: translate(-3px, 1px); opacity: 0.6; }
        96% { transform: translate(2px, 0); opacity: 0; }
      }

      .lost-terminal {
        margin-top: 8px;
        font-family: var(--mono);
        font-size: 0.85rem;
        color: var(--grey);
        min-height: 1.6em;
      }

      .lost-terminal .cursor-blink {
        display: inline-block;
        width: 7px;
        height: 1em;
        margin-left: 3px;
        background: var(--grey);
        vertical-align: -0.12em;
        animation: blink 1s steps(1) infinite;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      .lost-desc {
        max-width: 420px;
        font-size: 0.95rem;
        line-height: 1.7;
        color: var(--grey);
      }

      .lost-actions {
        display: flex;
        gap: 12px;
        margin-top: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .lost-hint {
        margin-top: 26px;
        font-family: var(--mono);
        font-size: 0.65rem;
        color: var(--grey-light);
      }
    </style>
  </head>

  <body class="site-ready">
    <div class="top-bar">
      <div class="top-bar-inner">
        <a href="index.html" class="logo">Georgia J. Summers</a>
        <nav class="top-nav">
          <a href="index.html#about">Profile</a>
          <a href="index.html#work">Work</a>
          <a href="index.html#experience">CV</a>
          <a href="index.html#skills">Skills</a>
          <a href="index.html#contact">Contact</a>
        </nav>
      </div>
    </div>

    <main>
      <div class="lost">
        <span class="lost-code">ERROR / PAGE NOT FOUND</span>

        <div class="lost-glitch">404</div>

        <div class="lost-terminal" id="lostTerminal"></div>

        <p class="lost-desc">
          The page you're looking for got lost somewhere between a
          spreadsheet and a set-piece. It's not here — but everything else
          is.
        </p>

        <div class="lost-actions">
          <a href="index.html" class="pill-btn">back to home</a>
          <button type="button" class="pill-btn ghost" id="retryBtn">search again</button>
        </div>

        <span class="lost-hint" id="retryHint"></span>
      </div>
    </main>

    <button class="float-btn theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
    </button>

    <script>
      // Theme init (shared key with main site)
      (function () {
        var root = document.documentElement;
        var saved = null;
        try {
          saved = localStorage.getItem("gjs-theme");
        } catch (e) {}
        if (saved === "dark") {
          root.setAttribute("data-theme", "dark");
        } else if (
          !saved &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          root.setAttribute("data-theme", "dark");
        }
      })();

      var themeToggle = document.getElementById("themeToggle");
      if (themeToggle) {
        themeToggle.addEventListener("click", function () {
          var root = document.documentElement;
          var isDark = root.getAttribute("data-theme") === "dark";
          if (isDark) {
            root.removeAttribute("data-theme");
          } else {
            root.setAttribute("data-theme", "dark");
          }
          try {
            localStorage.setItem("gjs-theme", isDark ? "light" : "dark");
          } catch (e) {}
        });
      }

      // Terminal typewriter
      var prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;
      var terminal = document.getElementById("lostTerminal");
      var lines = [
        "$ locate page",
        "searching filesystem…",
        "0 results — DATA NOT FOUND",
      ];

      if (terminal) {
        if (prefersReducedMotion) {
          terminal.textContent = lines[lines.length - 1];
        } else {
          var lineIndex = 0;
          var charIndex = 0;
          var cursorEl = document.createElement("span");
          cursorEl.className = "cursor-blink";

          function typeLine() {
            if (lineIndex >= lines.length) return;
            var current = lines[lineIndex];
            charIndex++;
            terminal.textContent = current.slice(0, charIndex);
            terminal.appendChild(cursorEl);

            if (charIndex === current.length) {
              lineIndex++;
              charIndex = 0;
              if (lineIndex < lines.length) {
                setTimeout(typeLine, 500);
              }
            } else {
              setTimeout(typeLine, 32);
            }
          }
          typeLine();
        }
      }

      // Playful "search again" retry that goes nowhere, then nudges home
      var retryBtn = document.getElementById("retryBtn");
      var retryHint = document.getElementById("retryHint");
      var retryCount = 0;

      if (retryBtn && retryHint) {
        retryBtn.addEventListener("click", function () {
          retryCount++;
          if (retryCount === 1) {
            retryHint.textContent = "still nothing…";
          } else if (retryCount === 2) {
            retryHint.textContent = "definitely not here.";
          } else {
            retryHint.textContent = "okay — just use the button above. ↑";
          }
        });
      }
    </script>
  </body>
</html>
